# Texte des releases GitHub, tiré de CHANGELOG.md. Quand le miroir pousse un main dont le
# CHANGELOG (ou le script qui en tire le texte) a changé, chaque release existante reçoit
# le texte de sa section. Seul le texte change : les fichiers joints et les tags restent.
# Lançable aussi à la main (onglet Actions, « Run workflow »).
name: Release notes

on:
  push:
    branches: [main]
    paths:
      - CHANGELOG.md
      - versions.json
      - scripts/release-notes.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-notes

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Réécrire le texte de chaque release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          for tag in $(gh release list --limit 200 --json tagName --jq '.[].tagName'); do
            if python3 scripts/release-notes.py "$tag" --github > notes.md; then
              gh release edit "$tag" --notes-file notes.md
              echo "$tag : texte mis à jour"
            else
              echo "$tag : pas de section dans CHANGELOG.md, texte inchangé"
            fi
          done
